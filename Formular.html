           <br>

           <label>
    <input type="checkbox" name="Allergien" value="laktose"> Laktose
  </label>

  </label>
   <input type="checkbox" name="Allergien" value="Andere"> Andere
  </label>
   <label for="Welche?"> Welche?</label>
                <input type="Welche?" name="Welche?" id="Welche?">

            <fieldset>

	                 	<p><label>Bemerkung:</label>
	                    <textarea name="notes" rows="4" cols="20"></textarea></p>
